# The dsh-task-notice bundle patch: one Loader row for this package.
#
# One row serves both halves. The row mounts the Host half (`main`), and because
# this package's manifest declares `dsh.client.platform: web`, that same row is
# what the client module table scans to find the browser half behind
# `exports["./client"]`.
#
# The row carries no `config`: every field has a default. A deployment that
# wants a different history size or wants subagent sessions in the list
# overrides this row by id in its own profile patch.

- insert:
    - id: task-notice
      name: 'dsh-task-notice'
