<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>dsh-task-notice · cover</title>
    <style>
      @font-face { font-family: 'PingFang'; src: local('PingFang SC'); }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
        background: #f7f8fa;
        color: #16181d;
        -webkit-font-smoothing: antialiased;
      }
      .cover {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 760px;
        gap: 72px;
        width: 1920px;
        height: 1080px;
        padding: 92px 104px 84px;
        overflow: hidden;
        background:
          radial-gradient(1000px 700px at 78% 6%, rgba(77, 107, 254, 0.08), transparent 70%),
          #f7f8fa;
      }
      .cover::after {
        content: '';
        position: absolute;
        right: -180px;
        bottom: -320px;
        width: 900px;
        height: 900px;
        border: 1px solid rgba(77, 107, 254, 0.08);
        border-radius: 50%;
        box-shadow: 0 0 0 90px rgba(77, 107, 254, 0.025), 0 0 0 180px rgba(77, 107, 254, 0.018);
      }
      .left { position: relative; z-index: 1; display: flex; flex-direction: column; }
      .kicker {
        font-family: 'SF Mono', Menlo, monospace;
        font-size: 22px;
        letter-spacing: 2px;
        color: #8b9098;
        text-transform: uppercase;
      }
      h1 {
        margin: 64px 0 0;
        font-size: 126px;
        line-height: 1.04;
        font-weight: 700;
        letter-spacing: -4px;
      }
      h1 em { font-style: normal; color: #4d6bfe; }
      .sub {
        margin: 34px 0 0;
        font-size: 36px;
        line-height: 1.5;
        color: #5b6068;
      }
      .meta {
        display: flex;
        gap: 12px;
        margin-top: auto;
        align-items: center;
      }
      .chip {
        padding: 10px 16px;
        border: 1px solid rgba(22, 24, 29, 0.14);
        border-radius: 10px;
        font-family: 'SF Mono', Menlo, monospace;
        font-size: 19px;
        color: #5b6068;
        background: rgba(255, 255, 255, 0.7);
      }
      .chip.blue { border-color: rgba(77, 107, 254, 0.3); color: #344cc9; }
      .right { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; }
      .panelWrap {
        position: relative;
        width: 462px;
        height: 650px;
        overflow: hidden;
        border-radius: 20px;
        border: 1px solid rgba(22, 24, 29, 0.1);
        background: #fff;
        box-shadow: 0 40px 100px rgba(16, 24, 40, 0.18);
      }
      .panelWrap img { display: block; width: 100%; }
      .panelWrap::after {
        content: '';
        position: absolute;
        inset: auto 0 0;
        height: 90px;
        background: linear-gradient(transparent, rgba(255,255,255,0.92));
      }
      .badge {
        position: absolute;
        right: 32px;
        top: 42px;
        display: grid;
        place-items: center;
        width: 82px;
        height: 82px;
        border-radius: 26px;
        background: #4d6bfe;
        color: #fff;
        font-family: 'SF Mono', Menlo, monospace;
        font-size: 38px;
        font-weight: 700;
        box-shadow: 0 18px 40px rgba(77, 107, 254, 0.32);
      }
      .badge::after {
        content: 'UNREAD';
        position: absolute;
        bottom: -26px;
        font-size: 11px;
        letter-spacing: 1.4px;
        color: #8b9098;
      }
    </style>
  </head>
  <body>
    <div class="cover">
      <div class="left">
        <div class="kicker">TASK NOTICE · DSH PLUGIN</div>
        <h1>跑完了<br /><em>别让答案等你</em></h1>
        <p class="sub">每个会话的完成提醒<br />项目、问题、用时，一眼看清。</p>
        <div class="meta">
          <span class="chip blue">dsh-task-notice</span>
          <span class="chip">v0.2.0</span>
          <span class="chip">MIT</span>
        </div>
      </div>
      <div class="right">
        <div class="panelWrap"><img src="../assets/panel-ledger.png" alt="任务通知台账" /></div>
        <div class="badge">4</div>
      </div>
    </div>
  </body>
</html>
